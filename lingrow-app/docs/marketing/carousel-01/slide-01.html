<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --dark:#0F0A1E; --purple:#7C3AED; --purple-light:#A78BFA; --lilac:#F0ABFC; --white:#FAFAFA; }
    html, body { width:1080px; height:1080px; overflow:hidden; }
    body {
      font-family:'Inter',sans-serif;
      background:var(--dark);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      position:relative;
    }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none; }
    .o1 { width:600px;height:600px;background:rgba(124,58,237,0.28);top:-120px;right:-120px; }
    .o2 { width:400px;height:400px;background:rgba(240,171,252,0.1);bottom:-80px;left:-80px; }
    .o3 { width:350px;height:350px;background:rgba(167,139,250,0.18);top:50%;left:50%;transform:translate(-50%,-50%); }
    .grid {
      position:absolute;inset:0;
      background-image:linear-gradient(rgba(124,58,237,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.06) 1px,transparent 1px);
      background-size:60px 60px;
    }
    .border {
      position:absolute;inset:0;
      border:1.5px solid rgba(124,58,237,0.35);
    }
    .border::after {
      content:'';position:absolute;inset:-1px;
      background:linear-gradient(135deg,rgba(124,58,237,0.9) 0%,transparent 35%,transparent 65%,rgba(240,171,252,0.6) 100%);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude; padding:1.5px;
    }
    .content { position:relative;z-index:5;text-align:center;display:flex;flex-direction:column;align-items:center; }
    .eyebrow {
      font-size:16px;font-weight:500;color:var(--purple-light);letter-spacing:4px;text-transform:uppercase;
      padding:10px 28px;border:1px solid rgba(167,139,250,0.3);border-radius:999px;
      background:rgba(124,58,237,0.1);margin-bottom:40px;
    }
    .line-soft { font-size:38px;color:var(--purple-light);line-height:1.4;margin-bottom:4px; }
    .main { font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:84px;color:var(--white);line-height:1.05;letter-spacing:-2px;margin-bottom:56px; }
    .cta-pill {
      display:inline-flex;align-items:center;gap:12px;
      font-size:24px;color:var(--lilac);font-weight:500;
      padding:18px 40px;background:rgba(240,171,252,0.08);
      border:1px solid rgba(240,171,252,0.25);border-radius:999px;
    }
    .slide-num { position:absolute;top:44px;left:64px;font-size:13px;color:var(--purple-light);opacity:0.5;letter-spacing:2px;z-index:10; }
    .logo { position:absolute;bottom:44px;right:64px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;color:var(--white);opacity:0.45;z-index:10; }
    .logo span { color:var(--purple-light);opacity:1; }
  </style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="grid"></div>
  <div class="border"></div>
  <div class="content">
    <div class="eyebrow">Pronúncia em inglês</div>
    <p class="line-soft">Você fala inglês</p>
    <p class="line-soft">mas os nativos</p>
    <p class="main">não te entendem.</p>
    <div class="cta-pill">Pode ser isso &nbsp;👇</div>
  </div>
  <div class="slide-num">01 / 09</div>
  <div class="logo">Ling<span>row</span></div>
</body>
</html>
