<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --dark:#0F0A1E; --light:#FAFAFA; --purple:#7C3AED; --purple-light:#A78BFA; --lilac:#F0ABFC; --black:#0D0D0D; --gray:#9CA3AF; }
    html, body { width:1080px; height:1080px; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:var(--light); display:flex; flex-direction:column; justify-content:center; position:relative; padding:80px; }
    .orb { position:absolute; border-radius:50%; filter:blur(100px); pointer-events:none; }
    .o1 { width:500px;height:500px;background:rgba(124,58,237,0.07);top:-100px;right:-100px; }
    .o2 { width:400px;height:400px;background:rgba(240,171,252,0.06);bottom:-80px;left:-80px; }
    .grid { position:absolute;inset:0;background-image:linear-gradient(rgba(124,58,237,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.04) 1px,transparent 1px);background-size:60px 60px; }
    .border { position:absolute;inset:0;border:1.5px solid rgba(124,58,237,0.15); }
    .border::after { content:'';position:absolute;inset:-1px;background:linear-gradient(135deg,rgba(124,58,237,0.6) 0%,transparent 35%,transparent 65%,rgba(240,171,252,0.4) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px; }
    .content { position:relative;z-index:5;display:flex;flex-direction:column; }
    .top-row { display:flex;align-items:center;justify-content:space-between;margin-bottom:32px; }
    .badge { background:var(--purple);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:18px;padding:10px 24px;border-radius:999px; }
    .dots { display:flex;gap:8px; }
    .dot { width:10px;height:10px;border-radius:50%;background:#D1D5DB; }
    .dot.on { background:var(--purple);width:28px;border-radius:999px; }
    .word { font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:96px;color:var(--black);line-height:1;letter-spacing:-3px;margin-bottom:32px; }
    .cards { display:flex;gap:20px;margin-bottom:28px; }
    .card { flex:1;padding:28px 32px;border-radius:20px; }
    .cw { background:#FEF2F2;border:1.5px solid #FECACA; }
    .cr { background:#F5F3FF;border:1.5px solid #DDD6FE; }
    .clabel { font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px; }
    .cw .clabel { color:#EF4444; } .cr .clabel { color:var(--purple); }
    .cpron { font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:36px;line-height:1.2; }
    .cw .cpron { color:#DC2626; } .cr .cpron { color:var(--purple); }
    .note { display:flex;align-items:center;gap:12px;font-weight:500;font-size:22px;color:var(--light);background:var(--dark);padding:20px 32px;border-radius:14px;border-left:4px solid var(--lilac); }
    .slide-num { position:absolute;top:44px;left:64px;font-size:13px;color:var(--gray);opacity:0.7;letter-spacing:2px;z-index:10; }
    .logo { position:absolute;bottom:44px;right:64px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;color:var(--black);opacity:0.25;z-index:10; }
    .logo span { color:var(--purple-light); }
  </style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="grid"></div><div class="border"></div>
  <div class="content">
    <div class="top-row">
      <div class="badge">#2 de 5</div>
      <div class="dots"><div class="dot"></div><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
    <div class="word">VEGETABLE</div>
    <div class="cards">
      <div class="card cw"><div class="clabel">❌ Você fala</div><div class="cpron">ve-ge-TÁ-bol</div></div>
      <div class="card cr"><div class="clabel">✓ Nativo fala</div><div class="cpron">VEJ-teh-bol</div></div>
    </div>
    <div class="note"><span>💡</span> Mesma coisa. Menos sílabas. Sempre.</div>
  </div>
  <div class="slide-num">04 / 09</div>
  <div class="logo">Ling<span>row</span></div>
</body>
</html>
