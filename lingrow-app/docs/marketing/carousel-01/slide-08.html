<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --dark:#0F0A1E; --purple:#7C3AED; --purple-light:#A78BFA; --lilac:#F0ABFC; --white:#FAFAFA; }
    html, body { width:1080px; height:1080px; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:var(--dark); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding:80px; text-align:center; }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none; }
    .o1 { width:600px;height:600px;background:rgba(124,58,237,0.35);top:-120px;right:-120px; }
    .o2 { width:500px;height:500px;background:rgba(240,171,252,0.15);bottom:-100px;left:-100px; }
    .o3 { width:400px;height:400px;background:rgba(167,139,250,0.22);top:50%;left:50%;transform:translate(-50%,-50%); }
    .radial { position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(124,58,237,0.3) 0%,transparent 65%);pointer-events:none; }
    .border { position:absolute;inset:0;border:1.5px solid rgba(124,58,237,0.35); }
    .border::after { content:'';position:absolute;inset:-1px;background:linear-gradient(135deg,rgba(124,58,237,0.9) 0%,transparent 35%,transparent 65%,rgba(240,171,252,0.6) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px; }
    .content { position:relative;z-index:5;display:flex;flex-direction:column;align-items:center; }
    .icon { width:100px;height:100px;border-radius:28px;background:rgba(124,58,237,0.2);border:1.5px solid rgba(124,58,237,0.4);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:52px; }
    .b1 { font-size:32px;color:rgba(255,255,255,0.6);line-height:1.7;margin-bottom:44px; }
    .b2 { font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:50px;color:var(--white);line-height:1.3;letter-spacing:-1px;margin-bottom:48px; }
    .b2 em { color:var(--lilac);font-style:normal; }
    .pill { font-size:24px;color:var(--lilac);font-weight:500;padding:20px 52px;background:rgba(240,171,252,0.1);border:1px solid rgba(240,171,252,0.3);border-radius:999px; }
    .slide-num { position:absolute;top:44px;left:64px;font-size:13px;color:var(--purple-light);opacity:0.5;letter-spacing:2px;z-index:10; }
    .logo { position:absolute;bottom:44px;right:64px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:26px;opacity:1;z-index:10;color:var(--white); }
    .logo span { color:var(--lilac); }
  </style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="radial"></div><div class="border"></div>
  <div class="content">
    <div class="icon">🧠</div>
    <p class="b1">O problema não é<br>você ser ruim em inglês.</p>
    <p class="b2">É que ninguém te ensinou<br>como as palavras<br><em>realmente soam.</em></p>
    <div class="pill">É pra isso que o Lingrow existe.</div>
  </div>
  <div class="slide-num">08 / 09</div>
  <div class="logo">Ling<span>row</span></div>
</body>
</html>
