<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --dark:#0F0A1E; --purple:#7C3AED; --purple-light:#A78BFA; --lilac:#F0ABFC; --white:#FAFAFA; }
    html, body { width:1080px; height:1080px; overflow:hidden; }
    body { font-family:'Inter',sans-serif; background:var(--dark); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding:80px; }
    .orb { position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none; }
    .o1 { width:500px;height:500px;background:rgba(124,58,237,0.22);top:-100px;right:-80px; }
    .o2 { width:350px;height:350px;background:rgba(240,171,252,0.1);bottom:-60px;left:-60px; }
    .grid { position:absolute;inset:0;background-image:linear-gradient(rgba(124,58,237,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.05) 1px,transparent 1px);background-size:60px 60px; }
    .border { position:absolute;inset:0;border:1.5px solid rgba(124,58,237,0.3); }
    .border::after { content:'';position:absolute;inset:-1px;background:linear-gradient(135deg,rgba(124,58,237,0.8) 0%,transparent 35%,transparent 65%,rgba(240,171,252,0.5) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px; }
    .content { position:relative;z-index:5;width:100%;display:flex;flex-direction:column;align-items:center;gap:32px; }
    .no-block { display:flex;flex-direction:column;gap:16px;width:100%; }
    .no-item { display:flex;align-items:center;gap:20px;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.22);border-radius:18px;padding:24px 36px; }
    .no-icon { font-size:28px;color:rgba(167,139,250,0.6); }
    .no-text { font-size:32px;color:var(--purple-light);font-family:'Inter',sans-serif; }
    .yes-block { font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:42px;color:var(--white);line-height:1.5;padding:36px 44px;background:rgba(240,171,252,0.06);border:1px solid rgba(240,171,252,0.2);border-radius:20px;text-align:center;width:100%; }
    .yes-block em { color:var(--lilac);font-style:normal; }
    .slide-num { position:absolute;top:44px;left:64px;font-size:13px;color:var(--purple-light);opacity:0.5;letter-spacing:2px;z-index:10; }
    .logo { position:absolute;bottom:44px;right:64px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;color:var(--white);opacity:0.45;z-index:10; }
    .logo span { color:var(--purple-light);opacity:1; }
  </style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="grid"></div>
  <div class="border"></div>
  <div class="content">
    <div class="no-block">
      <div class="no-item"><span class="no-icon">✗</span><span class="no-text">Não é seu vocabulário.</span></div>
      <div class="no-item"><span class="no-icon">✗</span><span class="no-text">Não é sua gramática.</span></div>
    </div>
    <div class="yes-block">
      É a pronúncia de palavras que você usa <em>todo dia</em> — e nunca ninguém te corrigiu.
    </div>
  </div>
  <div class="slide-num">02 / 09</div>
  <div class="logo">Ling<span>row</span></div>
</body>
</html>
