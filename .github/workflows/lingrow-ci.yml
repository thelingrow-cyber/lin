name: Lingrow CI

on:
  push:
    branches: [main]
    paths:
      - 'lingrow-app/mobile-new/**'
  pull_request:
    paths:
      - 'lingrow-app/mobile-new/**'

defaults:
  run:
    working-directory: lingrow-app/mobile-new

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lingrow-app/mobile-new/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test -- --ci
